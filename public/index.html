<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- maximum-scale и user-scalable убраны намеренно: с ними игрок
         не мог увеличить текст, а шрифтов меньше 12px в интерфейсе много
         (подпись навигации 10px, название предмета 9px). Это нарушало
         WCAG 1.4.4 и было особенно заметно после правки контраста:
         текст стал читаемым, но остался физически мелким. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- color-scheme: dark заставляет браузер рисовать нативные элементы
         (поля ввода, скроллбары, select, автозаполнение) в тёмных тонах.
         Без него светлая системная тема подставляла белые поля ввода. -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1a1814">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Last Hearth</title>
    <style>
        /* Critical CSS для мгновенного отображения.
           Значения повторяют :root из styles.css и держатся в синхроне с ним.
           Раньше тут была старая синяя палитра (#0f0f23 / #1a1a2e / #e0e0e0),
           из-за чего игрок видел скачок цветов в момент загрузки: синий экран
           сменялся тёплым коричневым интерфейсом. */
        :root {
            --boot-bg: #1a1814;      /* --bg-dark */
            --boot-text: #c4b998;    /* --text-primary */
            --boot-dim: #9a9080;     /* --text-secondary */
            --boot-card: #2a2520;    /* --bg-card */
            --boot-accent: #e07a6e;  /* --accent-red */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--boot-bg); }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--boot-bg);
            color: var(--boot-text);
            overflow-x: hidden;
            min-height: 100vh;
            /* 100vh не учитывает скрывающуюся адресную строку мобильного
               браузера; 100dvh всегда равен видимой высоте окна. Старые
               браузеры без dvh просто проигнорируют второе значение. */
            min-height: 100dvh;
        }
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--boot-bg);
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading-screen h1 {
            font-size: 2em;
            color: var(--boot-accent);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(224, 122, 110, 0.5);
        }
        .loader {
            width: 50px; height: 50px;
            border: 3px solid var(--boot-card);
            border-top-color: var(--boot-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            margin-top: 15px;
            color: var(--boot-dim);
            font-size: 0.9em;
        }
        /* Уважение к настройке «уменьшить движение»: колесо загрузки
           перестаёт крутиться. Показываем статичное кольцо. */
        @media (prefers-reduced-motion: reduce) {
            .loader { animation: none; border-top-color: var(--boot-accent); }
        }
        #game-content { display: none; }
    </style>
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="styles.css?v={{assetVersion}}">
    <link rel="manifest" href="/manifest.json">
    <!-- Официальный SDK Telegram Mini Apps: window.Telegram.WebApp и initData.
         Подключаем сами: если страницу открыть по ссылке с fragment
         #tgWebAppData=..., SDK прочитает данные из URL и авторизация сработает. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-dev-mode="{{devMode}}">
    <!-- Экран загрузки -->
    <div id="loading-screen">
        <h1>LAST HEARTH</h1>
        <div class="loader"></div>
        <p class="loading-text">Загрузка убежища...</p>
    </div>

    <!-- Основной контент -->
    <div id="game-content" style="display: none;">
        <!-- Навигация (класс .bottom-nav обязателен — стили описаны для него) -->
        <nav id="bottom-nav" class="bottom-nav">
            <button class="nav-btn active" data-screen="main"><span class="nav-icon">🏠</span><span class="nav-label">Убежище</span></button>
            <button class="nav-btn" data-screen="map"><span class="nav-icon">🗺️</span><span class="nav-label">Карта</span></button>
            <button class="nav-btn" data-screen="inventory"><span class="nav-icon">🎒</span><span class="nav-label">Вещи</span></button>
            <button class="nav-btn" data-screen="bosses"><span class="nav-icon">👹</span><span class="nav-label">Боссы</span></button>
            <button class="nav-btn" data-screen="clan"><span class="nav-icon">🏰</span><span class="nav-label">Клан</span></button>
        </nav>
    </div>

    <!-- DEV-флаг авторизации. ОБЯЗАТЕЛЬНО до game.js: тот читает его на
         этапе загрузки (const DEV_FALLBACK_ENABLED = window.__DEV_MODE__ === true).
         Значение подставляет сервер (DEV_MODE из .env). В production там
         всегда 'false', поэтому фиктивные telegram_id/initData недоступны
         и игра без Telegram просто не стартует. Инлайн-скрипт разрешён
         строгим CSP, потому что несёт nonce. -->
    <script nonce="{{nonce}}">
        window.__DEV_MODE__ = document.body.dataset.devMode === 'true';
    </script>

    <!-- Общие правила экипировки: читает и сервер (require), и эта страница.
         Обязательно ДО game.js — тот обращается к window.EquipmentShared
         на этапе загрузки (лимит слотов инвентаря). -->
    <script src="shared/equipment.js?v={{assetVersion}}" nonce="{{nonce}}"></script>
    <script src="game.js?v={{assetVersion}}" nonce="{{nonce}}"></script>
</body>
</html>
